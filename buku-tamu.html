  <main class="aliy_main">
    <h2>Silakan Tinggalkan Pesan Anda</h2>

    <section class="aliy_form_section">
      <form id="aliy_form">
        <label for="aliy_nama">Nama:</label>
        <input type="text" id="aliy_nama" name="aliy_nama" placeholder="Masukkan nama Anda" required>

        <label for="aliy_email">Email:</label>
        <input type="email" id="aliy_email" name="aliy_email" placeholder="Masukkan email Anda" required>

        <label for="aliy_pesan">Pesan:</label>
        <textarea id="aliy_pesan" name="aliy_pesan" rows="4" placeholder="Tulis pesan Anda..." required></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>

      
      <div id="aliy_output"></div>
    </section>
